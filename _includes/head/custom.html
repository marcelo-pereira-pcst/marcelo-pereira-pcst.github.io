{% include base_path %}

<!-- start custom head snippets -->

<!-- Support for Academicons -->
<link rel="stylesheet" href="{{ base_path }}/assets/css/academicons.css"/>

<!-- Tipografia: Source Serif 4 (títulos) + Inter (corpo e interface)
     Opção mais privada: baixar os .woff2 para /assets/fonts/ e usar @font-face,
     evitando requisição a servidores do Google (relevante sob a LGPD). -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Source+Serif+4:ital,opsz,wght@0,8..60,400..700;1,8..60,400&display=swap">

<!-- favicon from https://commons.wikimedia.org/wiki/File:OOjs_UI_icon_academic-progressive.svg -->
<link rel="apple-touch-icon" sizes="180x180" href="{{ base_path }}/images/apple-touch-icon-180x180.png"/>
<link rel="icon" type="image/svg+xml" href="{{ base_path }}/images/favicon.svg"/>
<link rel="icon" type="image/png" href="{{ base_path }}/images/favicon-32x32.png" sizes="32x32"/>
<link rel="icon" type="image/png" href="{{ base_path }}/images/favicon-192x192.png" sizes="192x192"/>
<link rel="manifest" href="{{ base_path }}/images/manifest.json"/>
<link rel="icon" href="/images/favicon.png"/>

<!-- Cor da barra do navegador acompanhando o tema claro/escuro -->
<meta name="theme-color" content="#fdfdfc" media="(prefers-color-scheme: light)"/>
<meta name="theme-color" content="#16181a" media="(prefers-color-scheme: dark)"/>

<!-- Prévia em redes sociais e apps de mensagem.
     Sem isto, um link do site compartilhado no WhatsApp/Bluesky/LinkedIn
     aparece como um retângulo cinza sem imagem.
     Só entra em ação depois que você criar a imagem 1200x630 em
     /images/og-default.png E descomentar `og_image` no _config.yml. -->
{% if site.og_image %}
  <meta property="og:image" content="{{ site.url }}{{ site.og_image }}"/>
  <meta property="og:image:width" content="1200"/>
  <meta property="og:image:height" content="630"/>
  <meta name="twitter:card" content="summary_large_image"/>
{% endif %}

<!-- Versões em outros idiomas da página de apresentação.
     Declaradas nas QUATRO páginas (e apontando umas para as outras), que é o
     que o Google exige: uma declaração unilateral é ignorada.
     x-default indica qual servir a quem não fala nenhuma delas. -->
{% assign paginas_idioma = "/,/about-en/,/about-es/,/about-fr/" | split: "," %}
{% if paginas_idioma contains page.url %}
  <link rel="alternate" hreflang="pt-BR"     href="{{ site.url }}/"/>
  <link rel="alternate" hreflang="en"        href="{{ site.url }}/about-en/"/>
  <link rel="alternate" hreflang="es"        href="{{ site.url }}/about-es/"/>
  <link rel="alternate" hreflang="fr"        href="{{ site.url }}/about-fr/"/>
  <link rel="alternate" hreflang="x-default" href="{{ site.url }}/about-en/"/>
{% endif %}

<!-- Dados estruturados: ajuda o Google a entender que este é o site
     de uma pessoa, com afiliação e identificadores acadêmicos. -->
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Person",
  "name": "Marcelo Pereira",
  "url": "{{ site.url }}",
  "image": "{{ site.url }}/images/profile.jpg",
  "jobTitle": "Doutorando em Sociologia",
  "affiliation": {
    "@type": "CollegeOrUniversity",
    "name": "Universidade Federal de Minas Gerais"
  },
  "knowsAbout": [
    "Divulgação científica",
    "Comunicação pública da ciência e tecnologia",
    "Sociologia da ciência",
    "Estudos sociais de ciência e tecnologia"
  ],
  "sameAs": [
    "https://orcid.org/0000-0002-4219-5147",
    "https://scholar.google.com/citations?hl=pt-BR&user=-xkHrGUAAAAJ",
    "https://www.researchgate.net/profile/Marcelo-Pereira-44",
    "https://ufmg.academia.edu/PereiraMarcelo",
    "https://github.com/marcelo-pereira-pcst",
    "https://bsky.app/profile/marcelop.bsky.social",
    "https://www.linkedin.com/in/marcelo-pereira-6a28b5107"
  ],
  "identifier": "https://orcid.org/0000-0002-4219-5147"
}
</script>

<!-- end custom head snippets -->
