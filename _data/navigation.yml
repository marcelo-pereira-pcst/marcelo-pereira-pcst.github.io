# Ordem dos links no cabeçalho do site.
#
# Alterações em relação ao arquivo original:
#  - Rótulos todos em português (antes: "About Me", "Curriculum", "Portfolio"
#    misturados com "Publicações", "Comunicações", "Novidades").
#  - "About Me" apontava para /about-en/ — o item "sobre mim" levava para a
#    versão em INGLÊS, enquanto a home já é o "sobre mim" em português.
#    Agora o inglês é um item explícito de idioma, no fim do menu.
#  - "Pesquisa": página nova, com a tese em andamento.
#  - "Oficinas": página nova, para oficinas e minicursos.
#  - "Portfolio" -> "Projetos": em português, "portfólio" soa a design;
#    "Projetos" descreve melhor um dashboard de dados de survey.
#
# São oito itens — o limite do que cabe numa linha em telas médias. Se quiser
# enxugar, o primeiro candidato a sair é "Novidades" (movendo os últimos posts
# para a home) e o segundo é "Currículo" (linkado a partir de /pesquisa/).

main:

  - title: "Pesquisa"
    url: /pesquisa/

  - title: "Publicações"
    url: /publications/

  - title: "Comunicações"
    url: /talks/

  - title: "Oficinas"
    url: /oficinas/

  - title: "Projetos"
    url: /portfolio/

  - title: "Currículo"
    url: /cv/

  - title: "Novidades"
    url: /year-archive/

  - title: "EN"
    url: /about-en/
